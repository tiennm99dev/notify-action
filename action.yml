name: Notify Action
description: Send notifications to messaging platforms when GitHub Actions run
author: Tien Nguyen Minh (tiennm99)
branding:
  icon: bell
  color: blue

inputs:
  platform:
    description: Messaging platform to use (telegram, discord)
    required: true
    default: telegram

  message:
    description: The message content to send. Defaults to a summary of the workflow run formatted for the platform.
    required: false

  status:
    description: The status of the workflow (success, failure, cancelled, or any custom text). Pass job.status to report the real outcome.
    required: false
    default: success

  telegram_bot_token:
    description: Telegram Bot API Token
    required: false

  telegram_chat_id:
    description: Telegram Chat ID to send message to
    required: false

  discord_webhook_url:
    description: Discord channel webhook URL
    required: false

runs:
  using: node24
  main: dist/index.js
