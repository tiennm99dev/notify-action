name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Move the major version tag to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $TAG is not vX.Y.Z; leaving the major tag alone."
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
